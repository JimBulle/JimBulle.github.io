<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bert's Portfolio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Custom CSS -->
    <style>
      @font-face {
        font-family: 'PixdorTwo';
        src: url(assets/PixdorTwo.ttf) format('truetype');
        font-weight: bold;
        font-style: normal;
      }

      body {
        font-family: 'PixdorTwo', sans-serif;
        margin: 0;
        background: linear-gradient(to bottom, #2261ff, #f2f8ff);
        color: #222;
        overflow-x: hidden;
        cursor: url('assets/cursor.png'), auto;
      }

      a, button {
        cursor: url('assets/hand.png'), pointer;
      }

      header {
        text-align: center;
        padding: 2rem 1rem;
      }

      header img {
        max-width: 400px;
        width: 90%;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 2rem;
        padding: 2rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .menu-item {
        background: white;
        border-radius: 20px;
        border: 2px solid #c5e0ff;
        padding: 1rem;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        transition: transform 0.2s ease;
      }

      .proj-img {
        max-width: 100%;
        border-radius: 12px;
      }

      .menu-item:hover {
        transform: scale(1.05);
      }

      .menu-item img {
        max-width: 30%;
        border-radius: 12px;
      }

      .menu-item button {
        margin-top: 0.75rem;
        background: linear-gradient(to bottom, #cbf7ff, #aef0ce);
        border: none;
        border-radius: 10px;
        padding: 0.5rem 1rem;
        font-size: 1.1rem;
        color: #222;
        box-shadow: 0 4px 0 #78c6a3;
      }

      .footer {
        text-align: center;
        padding: 2rem;
        font-size: 1.2rem;
        color: #444;
      }
    </style>
  </head>
  <body>
    <!-- Logo/Header -->
    <header>
      <a href="index.html"><img src="assets/BERT’S PORTFOLIO.png" alt="Bert's Portfolio Logo"></a>
    </header>

    <!-- Main Menu -->
    <div class="menu-grid">
      <div class="menu-item">
        <img src="assets/me.jpeg" alt="About Bert">
        <button onclick="location.href='about.html'">About Me</button>
      </div>
      <div class="menu-item">
        <img src="assets/proj.jpeg" alt="Projects" class="proj-img">
        <a href="https://github.com/JimBulle" target="_blank" rel="noopener" class="btn btn-link" style="text-decoration:none;">
          <button>Projects</button>
        </a>
      </div>
      <div class="menu-item">
        <img src="assets/conta.jpeg" alt="Socials">
        <button onclick="location.href='#contact'">Contact</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      &copy; 2025 Bert. All rights reserved.
    </div>
  </body>
</html>
